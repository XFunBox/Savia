name: Publicar Savia 2.0

on:
  push:
    tags: ['v2.0.0']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Obtener la version verificada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar integridad de la APK
        working-directory: descargas
        run: sha256sum --check Savia-2.0.0.sha256
      - name: Publicar APK y notas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --json isDraft --jq .isDraft > /tmp/savia-release-state; then
            if [ "$(cat /tmp/savia-release-state)" = "false" ]; then
              echo "La version 2.0 ya esta publicada."
              exit 0
            fi
          else
            gh release create v2.0.0 --verify-tag --draft --title 'Savia 2.0.0' --notes-file docs/notas-version-2.0.md
          fi
          gh release upload v2.0.0 descargas/Savia-2.0.0.apk descargas/Savia-2.0.0.sha256 --clobber
          gh release edit v2.0.0 --draft=false
          gh release view v2.0.0 --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
