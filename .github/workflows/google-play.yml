name: Preparar AAB para Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName esperado, en formato X.Y.Z'
        required: true
        type: string
        default: '3.0.0'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAVIA_VERSION: ${{ inputs.version }}
      SAVIA_STORE_PASSWORD: ${{ secrets.SAVIA_STORE_PASSWORD }}
      SAVIA_KEY_ALIAS: ${{ secrets.SAVIA_KEY_ALIAS }}
      SAVIA_KEY_PASSWORD: ${{ secrets.SAVIA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Recuperar clave definitiva
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVIA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SAVIA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versión inválida: usa X.Y.Z.'; exit 1; }
          for variable in KEYSTORE_BASE64 SAVIA_STORE_PASSWORD SAVIA_KEY_ALIAS SAVIA_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Falta el secreto $variable. Consulta docs/publicacion.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/savia-release.keystore"
          echo "SAVIA_KEYSTORE_FILE=$RUNNER_TEMP/savia-release.keystore" >> "$GITHUB_ENV"
      - name: Pruebas, APK, AAB y lint de publicación
        run: bash gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease lintRelease
      - name: Comprobar controles y APK firmada
        run: |
          bash scripts/probar-verificacion.sh
          bash scripts/verificar-apk.sh app/build/outputs/apk/release/app-release.apk "$SAVIA_VERSION"
      - name: Verificar firma del AAB y preparar archivos
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" > "$RUNNER_TEMP/savia-aab-verification.txt"
          grep -Fxq 'jar verified.' "$RUNNER_TEMP/savia-aab-verification.txt"
          if grep -Fq 'contains unsigned entries' "$RUNNER_TEMP/savia-aab-verification.txt"; then
            echo 'El AAB contiene entradas sin firmar.'
            exit 1
          fi
          fingerprint="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$fingerprint" = "$(cat scripts/certificado-release.sha256)" || { echo 'Firma del AAB distinta de la definitiva.'; exit 1; }
          mkdir -p dist
          cp "$aab" "dist/Savia-$SAVIA_VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/Savia-$SAVIA_VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          (cd dist && sha256sum "Savia-$SAVIA_VERSION.aab" "Savia-$SAVIA_VERSION.apk" mapping.txt > SHA256SUMS)
      - name: Guardar artefactos para revisión manual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Savia-Play-${{ inputs.version }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/savia-release.keystore"
