name: Comprobar y publicar Savia

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Pruebas, APK de desarrollo y lint
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Comprobar controles de publicación
        run: bash scripts/probar-verificacion.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    concurrency:
      group: publicar-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SAVIA_KEYSTORE_FILE: ${{ runner.temp }}/savia-release.keystore
      SAVIA_STORE_PASSWORD: ${{ secrets.SAVIA_STORE_PASSWORD }}
      SAVIA_KEY_ALIAS: ${{ secrets.SAVIA_KEY_ALIAS }}
      SAVIA_KEY_PASSWORD: ${{ secrets.SAVIA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Recuperar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVIA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 SAVIA_STORE_PASSWORD SAVIA_KEY_ALIAS SAVIA_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Falta el secreto $variable. Consulta docs/publicacion.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SAVIA_KEYSTORE_FILE"
      - name: Compilar APK firmada y comprobar lint de publicación
        run: bash gradlew --no-daemon assembleRelease lintRelease
      - name: Verificar firma y versión
        run: bash scripts/verificar-apk.sh app/build/outputs/apk/release/app-release.apk "${GITHUB_REF_NAME#v}"
      - name: Publicar APK y suma de comprobación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Savia-$version.apk"
          (cd dist && sha256sum "Savia-$version.apk" > "Savia-$version.sha256")
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            if [ "$(cat "$RUNNER_TEMP/release-state")" != true ]; then
              echo 'Esta versión ya está publicada; crea una versión nueva.'
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Savia $version" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/Savia-$version.apk" "dist/Savia-$version.sha256" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$SAVIA_KEYSTORE_FILE"
